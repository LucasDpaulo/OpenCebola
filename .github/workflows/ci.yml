name: Verificar OpenCebola
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run test:tooling
      - run: npm run typecheck
      - run: npm test
      - run: npm run test --workspace=@cebola/roku
      - run: npm run test --workspace=@cebola/tizen
      - run: npm run setup
      - run: npm run build
